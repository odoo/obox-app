name: "obox-app"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "Odoo <stva@odoo.com>"
description: "POS Printer Proxy for Odoo"
vendor: "Odoo"
homepage: "https://github.com/odoo/obox-app"
license: "LGPL-3.0"
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libusb-1.0-0
contents:
  - src: ./build/bin/obox-app-linux-amd64
    dst: /usr/bin/obox-app
    file_info:
      mode: 0755
  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/256x256/apps/obox-app.png
  - src: ./build/bin/obox-app.desktop
    dst: /usr/share/applications/obox-app.desktop
