name: PR Validation

on:
  pull_request:
    branches:
      - main

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'obox-app-linux64'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'

          - name: 'obox-app-win64'
            platform: 'windows/amd64'
            os: 'windows-latest'

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wails
        uses: ./.github/actions
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          package: false
          go-version: '1.26.0'
          node-version: '22.20.0'
