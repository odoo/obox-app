name: "Wails Build Action"
description: "Centralized build, test, and release action powered by Task"

inputs:
  build-name:
    description: "The name of the binary file"
    required: true
  build-platform:
    description: "Platform to build for (e.g. linux/amd64, windows/amd64)"
    required: false
    default: "linux/amd64"
  macos-app-name:
    description: "The name of the macOS app"
    required: false
    default: "Obox App"
  package:
    description: "Whether to upload artifacts and create GitHub releases"
    required: false
    default: "true"
  go-version:
    description: "Go version to use"
    required: false
    default: "1.26.0"
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22.20.0"
  token:
    description: "GitHub token for releases"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # ── 1. Setup Toolchains ──────────────────────────────────────────────────
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        check-latest: true
        cache: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Setup Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x

    # ── 2. Install Platform System Dependencies ──────────────────────────────
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: task ci:deps:linux

    - name: Install macOS Dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: task ci:deps:darwin

    - name: Install Windows MSYS2 & Toolchain
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        install: >-
          mingw-w64-x86_64-libusb
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-nsis

    # ── 3. Install Wails v3 CLI ──────────────────────────────────────────────
    - name: Install Wails v3 CLI
      shell: bash
      run: task ci:deps:wails

    # ── 4. Run Automated Tests ───────────────────────────────────────────────
    - name: Run Tests (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: task test

    - name: Run Tests (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: task test

    # ── 5. Build Application via Task ─────────────────────────────────────────
    - name: Build Application (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: task build:ci BUILD_NAME=${{ inputs.build-name }}

    - name: Build Application (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: task build:ci BUILD_NAME=${{ inputs.build-name }}

    # ── 6. Publish / Release (When package is enabled) ────────────────────────
    - name: Upload Artifacts
      if: inputs.package == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.build-name }}
        path: build/bin/*

    - name: Create Release
      if: inputs.package == 'true' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/bin/*
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
